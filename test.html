<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tests — Statistikkportalen (SSB)</title>
  <style>
    body { font-family: monospace; margin: 2em; background: #1a1a2e; color: #e0e0e0; }
    h1 { font-size: 1.2em; }
    .pass { color: #4caf50; }
    .fail { color: #f44336; }
    .suite { margin: 1em 0 0.3em; font-weight: bold; color: #90caf9; }
    .result { margin-left: 1.5em; }
    #summary { margin-top: 1.5em; padding: 0.5em; font-weight: bold; }
    #summary.all-pass { background: #1b5e20; color: #a5d6a7; }
    #summary.has-fail { background: #b71c1c; color: #ef9a9a; }
  </style>
</head>
<body>
  <h1>Statistikkportalen (SSB) — Tests</h1>
  <div id="output"></div>
  <div id="summary"></div>

  <!-- Load app scripts in dependency order (same as index.html) -->
  <script src="js/version.js"></script>
  <script src="js/config.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/router.js"></script>
  <script src="js/subjects.js"></script>
  <script src="js/menu-hierarchy.js"></script>
  <script src="js/browser-state.js"></script>
  <script src="js/synonyms.js"></script>
  <script src="js/search-enhanced.js"></script>
  <!-- Loaded out of index.html order: only needed here for the VarSelect,
       isTimeDimension, getTimeShortcut, definition-link, table-metadata,
       status-flag, mandatory-note and note-link tests. Safe to load
       standalone — they only declare state and functions; their DOM/runtime
       refs live inside function bodies. -->
  <script src="js/variable-select-state.js"></script>
  <script src="js/variable-select-render.js"></script>
  <script src="js/variable-select-api.js"></script>
  <script src="js/table-display.js"></script>
  <script src="js/table-metadata.js"></script>
  <!-- chart-view.js only needs Chart.js inside renderChart(); buildChartData() is pure -->
  <script src="js/chart-view.js"></script>

  <script>
    // Minimal test runner
    const _out = document.getElementById('output');
    const _summary = document.getElementById('summary');
    let _passed = 0, _failed = 0;

    function suite(name) {
      const el = document.createElement('div');
      el.className = 'suite';
      el.textContent = name;
      _out.appendChild(el);
    }

    function assert(description, condition) {
      const el = document.createElement('div');
      el.className = 'result';
      if (condition) {
        el.innerHTML = '<span class="pass">PASS</span> ' + description;
        _passed++;
      } else {
        el.innerHTML = '<span class="fail">FAIL</span> ' + description;
        _failed++;
      }
      _out.appendChild(el);
    }

    function assertEqual(description, actual, expected) {
      const pass = actual === expected;
      const el = document.createElement('div');
      el.className = 'result';
      if (pass) {
        el.innerHTML = '<span class="pass">PASS</span> ' + description;
        _passed++;
      } else {
        el.innerHTML = '<span class="fail">FAIL</span> ' + description +
          ' — expected: ' + JSON.stringify(expected) + ', got: ' + JSON.stringify(actual);
        _failed++;
      }
      _out.appendChild(el);
    }

    function showSummary() {
      const total = _passed + _failed;
      _summary.textContent = _passed + '/' + total + ' passed' + (_failed ? ', ' + _failed + ' FAILED' : '');
      _summary.className = _failed ? 'has-fail' : 'all-pass';
    }

    // -----------------------------------------------------------------------
    // Tests
    // -----------------------------------------------------------------------

    suite('AppConfig — SSB instance');
    assertEqual('API base URL', AppConfig.apiBaseUrl, 'https://data.ssb.no/api/pxwebapi/v2');
    assertEqual('source.name', AppConfig.source.name, 'SSB');
    assertEqual('source.nameFull', AppConfig.source.nameFull, 'Statistisk sentralbyrå');
    assertEqual('source.licenseName', AppConfig.source.licenseName, 'CC BY 4.0');
    assertEqual('app.name', AppConfig.app.name, 'Statistikkportalen');
    assertEqual('analytics.scriptUrl', AppConfig.analytics.scriptUrl, 'https://stats.statistikkportalen.no/script.js');
    assert('analytics.websiteId is set', typeof AppConfig.analytics.websiteId === 'string' && AppConfig.analytics.websiteId.length > 0);
    assertEqual('analytics.domains', AppConfig.analytics.domains, 'statistikkportalen.no');
    assertEqual('analytics.doNotTrack', AppConfig.analytics.doNotTrack, true);
    assertEqual('source.statisticsPageBase (nb, via localized)', localized(AppConfig.source.statisticsPageBase), 'https://www.ssb.no/');
    assertEqual('source.statisticsPageBase.en', AppConfig.source.statisticsPageBase.en, 'https://www.ssb.no/en/');
    assertEqual('source.savedQueryUrl', AppConfig.source.savedQueryUrl, 'https://www.ssb.no/statbank/sq/{id}');
    assertEqual('ui.topicCardDepth (two card levels for SSB)', AppConfig.ui.topicCardDepth, 2);

    suite('Rate budget — half of the source\'s limit');
    assertEqual('SSB limit: 40 per 60 s', JSON.stringify(AppConfig.limits.rateLimit), JSON.stringify({ calls: 40, windowMs: 60000 }));
    assertEqual('share 0.5', AppConfig.limits.rateLimitShare, 0.5);
    assertEqual('budget: 20 per 60 s', JSON.stringify(api._rateBudget()), JSON.stringify({ calls: 20, windowMs: 60000 }));
    const _savedLimit = AppConfig.limits.rateLimit;
    api._applyConfig({ maxCallsPerTimeWindow: 0, timeWindow: 0 });
    assert('/config with 0 (SSB) keeps the configured limit', AppConfig.limits.rateLimit === _savedLimit);
    api._applyConfig({ maxCallsPerTimeWindow: 30, timeWindow: 10 });
    assertEqual('/config with a limit (SCB: 30 per 10 s) wins',
      JSON.stringify(AppConfig.limits.rateLimit), JSON.stringify({ calls: 30, windowMs: 10000 }));
    assertEqual('… and the budget is 15 per 10 s', JSON.stringify(api._rateBudget()), JSON.stringify({ calls: 15, windowMs: 10000 }));
    AppConfig.limits.rateLimit = _savedLimit;

    suite('Translations — every nb key also in en and sv');
    // sv isn't enabled for SSB, but the SCB instance (config-sv.js) runs in sv
    const _nbKeys = Object.keys(translations.nb);
    for (const _lang of ['en', 'sv']) {
      const _missing = _nbKeys.filter(k => !(k in translations[_lang]));
      assert(_lang + ' has every nb key' + (_missing.length ? ' — missing: ' + _missing.slice(0, 6).join(', ') : ''),
        _missing.length === 0);
    }
    assertEqual('defaultLanguage', AppConfig.defaultLanguage, 'nb');
    assertEqual('first language code', AppConfig.languages[0].code, 'nb');
    assertEqual('first language apiLang', AppConfig.languages[0].apiLang, 'no');
    assertEqual('maxCells', AppConfig.limits.maxCells, 800000);
    assertEqual('cellWarningThreshold', AppConfig.limits.cellWarningThreshold, 600000);
    assertEqual('sourceUpdateTimes has 3 entries', AppConfig.sourceUpdateTimes.length, 3);

    suite('AppConfig — tagline');
    assert('tagline has nb key', typeof AppConfig.app.tagline.nb === 'string');
    assert('tagline has en key', typeof AppConfig.app.tagline.en === 'string');
    assert('tagline.nb mentions SSB', AppConfig.app.tagline.nb.includes('SSB'));
    assert('tagline.en mentions Statistics Norway', AppConfig.app.tagline.en.includes('Statistics Norway'));

    suite('Translations — nb language');
    assertEqual('t() defaults to nb', currentLanguage, 'nb');
    assert('t("loading.app") returns Norwegian', t('loading.app') === 'Laster...');
    assert('t("nav.home") returns Norwegian', t('nav.home') === 'Forsiden');
    assert('t("search.heading") returns Norwegian', t('search.heading').includes('statistikkbanken'));

    suite('Translations — saveQuery keys');
    assert('nb saveQuery.title exists', t('saveQuery.title') !== 'saveQuery.title');
    assert('nb saveQuery.copy exists', t('saveQuery.copy') !== 'saveQuery.copy');
    assert('nb saveQuery.saved exists', t('saveQuery.saved') !== 'saveQuery.saved');

    suite('Translations — keys added for 1.5.0 exist in nb, en and sv');
    // Checked in the dictionaries directly: sv is not enabled in this instance,
    // so setLanguage('sv') is a no-op. Add new keys to this list.
    const _newKeys = ['variable.defaultSelectionEmpty', 'variable.definitionLink',
      'table.preliminary', 'table.nil', 'table.notYetAvailable',
      'metadata.title', 'metadata.source', 'metadata.updated', 'metadata.status', 'metadata.official',
      'metadata.about', 'metadata.notes', 'metadata.contact', 'metadata.phone', 'metadata.definitions',
      'error.tableNotFound', 'error.tableNotFoundTitle', 'error.tableChangesLink'];
    _newKeys.forEach(key => ['nb', 'en', 'sv'].forEach(lang =>
      assert(lang + ' ' + key, typeof translations[lang][key] === 'string' && translations[lang][key] !== '')));

    suite('Translations — SSB subject groups (nb)');
    assert('subject.group.arbeid exists', t('subject.group.arbeid') !== 'subject.group.arbeid');
    assert('subject.group.okonomi exists', t('subject.group.okonomi') !== 'subject.group.okonomi');
    assert('subject.group.befolkning exists', t('subject.group.befolkning') !== 'subject.group.befolkning');

    suite('Translations — SSB subject names (nb)');
    assert('subject.name.al exists', t('subject.name.al') !== 'subject.name.al');
    assert('subject.name.be exists', t('subject.name.be') !== 'subject.name.be');
    assert('subject.name.nk exists', t('subject.name.nk') !== 'subject.name.nk');
    assert('subject.name.ud exists', t('subject.name.ud') !== 'subject.name.ud');

    suite('localized — instance settings given per language');
    assertEqual('object → the active language (nb)', localized({ nb: 'a', en: 'b' }), 'a');
    assertEqual('a plain value is returned as is', localized('x'), 'x');
    assertEqual('null → ""', localized(null), '');
    assertEqual('undefined → ""', localized(undefined), '');
    assertEqual('tagline follows the language', localized(AppConfig.app.tagline), AppConfig.app.tagline.nb);

    suite('Translations — English');
    setLanguage('en');
    assert('en saveQuery.title exists', t('saveQuery.title') !== 'saveQuery.title');
    assert('en subject.group.arbeid exists', t('subject.group.arbeid') !== 'subject.group.arbeid');
    assert('en subject.name.al exists', t('subject.name.al') !== 'subject.name.al');
    assertEqual('localized: object → en', localized({ nb: 'a', en: 'b' }), 'b');
    assertEqual('localized: no en → falls back to nb', localized({ nb: 'a' }), 'a');
    assert('tableChangesUrl in English is the /en/ page', localized(AppConfig.source.tableChangesUrl).startsWith('https://www.ssb.no/en/statbank/'));
    setLanguage('nb'); // restore

    suite('Translations — getCurrentApiLang');
    assertEqual('nb → apiLang no', getCurrentApiLang(), 'no');

    suite('SubjectConfig — SSB subjects');
    assert('subjectGroups exists', typeof SubjectConfig.subjectGroups === 'object');
    assertEqual('6 subject groups', Object.keys(SubjectConfig.subjectGroups).length, 6);
    assert('arbeid group has al', SubjectConfig.subjectGroups.arbeid.subjects.includes('al'));
    assert('arbeid group has ud', SubjectConfig.subjectGroups.arbeid.subjects.includes('ud'));
    assert('okonomi group has nk', SubjectConfig.subjectGroups.okonomi.subjects.includes('nk'));
    assert('subjectNames has al', SubjectConfig.subjectNames['al'].nb === 'Arbeid og lønn');
    assert('subjectNames has be', SubjectConfig.subjectNames['be'].nb === 'Befolkning');

    // Verify all subjects in groups have names, and every name and group label exists in nb, en and sv
    const _langs = ['nb', 'en', 'sv'];
    const allGroupSubjects = Object.values(SubjectConfig.subjectGroups).flatMap(g => g.subjects);
    const missingNames = allGroupSubjects.filter(s => !_langs.every(l => SubjectConfig.subjectNames[s]?.[l]));
    assert('all grouped subjects have names in nb, en and sv (' + allGroupSubjects.length + ' subjects)',
      missingNames.length === 0);
    const missingGroupLabels = Object.values(SubjectConfig.subjectGroups).filter(g => !_langs.every(l => g.label?.[l]));
    assert('all subject groups have labels in nb, en and sv', missingGroupLabels.length === 0);

    suite('SubjectConfig — names registered in the translation dictionary');
    // Checked in the dictionaries directly (sv is not enabled in this instance)
    const _unregistered = [];
    _langs.forEach(l => {
      Object.entries(SubjectConfig.subjectGroups).forEach(([id, g]) => {
        if (translations[l]['subject.group.' + id] !== g.label[l]) _unregistered.push(l + ' group ' + id);
      });
      Object.entries(SubjectConfig.subjectNames).forEach(([code, n]) => {
        if (translations[l]['subject.name.' + code] !== n[l]) _unregistered.push(l + ' name ' + code);
      });
    });
    assert('every group and subject name is registered in nb, en and sv' +
      (_unregistered.length ? ' — missing: ' + _unregistered.slice(0, 5).join(', ') : ''), _unregistered.length === 0);
    assertEqual('t() resolves a subject name (nb)', t('subject.name.al'), 'Arbeid og lønn');
    assertEqual('sv subject name', translations.sv['subject.name.ut'], 'Utrikeshandel');

    suite('SearchSynonyms — Norwegian');
    assert('SearchSynonyms is array', Array.isArray(SearchSynonyms));
    assert('has synonym groups', SearchSynonyms.length >= 10);
    const bnpGroup = SearchSynonyms.find(g => g.includes('bnp'));
    assert('BNP synonym group exists', !!bnpGroup);
    assert('BNP group has bruttonasjonalprodukt', bnpGroup && bnpGroup.includes('bruttonasjonalprodukt'));
    const kpiGroup = SearchSynonyms.find(g => g.includes('kpi'));
    assert('KPI synonym group exists', !!kpiGroup);
    assert('KPI group has konsumprisindeks', kpiGroup && kpiGroup.includes('konsumprisindeks'));

    suite('CacheManager — SSB namespace');
    const cm = new CacheManager();
    assertEqual('prefix is ssb_', cm.prefix, 'ssb_');
    assertEqual('IndexedDB name is ssb_cache', cm.indexedDBCache.dbName, 'ssb_cache');

    suite('CacheManager — schedule staleness enabled');
    // With 3 sourceUpdateTimes, _getLastSourceUpdateTimestamp should return a real timestamp
    assert('last source update is a positive timestamp', cm._getLastSSBUpdateTimestamp() > 0);

    suite('PxWebApi — class and base URL');
    assert('api is instance of SSBApi', api.constructor.name === 'SSBApi');
    assertEqual('api.baseUrl', api.baseUrl, 'https://data.ssb.no/api/pxwebapi/v2');

    suite('api._buildApiError — today\'s rules, plus a table that doesn\'t exist');
    // Body as SSB returns it for 11038 (removed) and 99999 (never existed), 2026-11-08
    const _gone = { type: 'Parameter error', title: 'Non-existent table', status: 404 };
    const _e404 = api._buildApiError(404, 'Not Found', _gone);
    assert('404 Non-existent table → tableNotFound', _e404.tableNotFound === true);
    assertEqual('…with a translated message for the user', _e404.userMessage, t('error.tableNotFound'));
    assertEqual('…and the table-changes page (nb)', _e404.helpUrl, AppConfig.source.tableChangesUrl.nb);
    assertEqual('…the technical message is still the API title', _e404.message, 'Non-existent table');
    assert('400 from /data with the same title → tableNotFound', api._buildApiError(400, 'Bad Request', _gone).tableNotFound === true);
    const _savedChanges = AppConfig.source.tableChangesUrl;
    AppConfig.source.tableChangesUrl = null;
    assertEqual('no tableChangesUrl (other instances) → no helpUrl', api._buildApiError(404, 'Not Found', _gone).helpUrl, null);
    AppConfig.source.tableChangesUrl = _savedChanges;
    const _e400 = api._buildApiError(400, 'Bad Request', { title: 'Bad Request', detail: 'Value XXXX not found' });
    assertEqual('other errors: detail first', _e400.message, 'Value XXXX not found');
    assert('other errors: no userMessage, no helpUrl', !_e400.userMessage && !_e400.helpUrl && !_e400.tableNotFound);
    assertEqual('429 → rate-limit message', api._buildApiError(429, 'Too Many Requests', null).message, t('error.rateLimit'));
    assertEqual('403 without a body → cell-limit message', api._buildApiError(403, 'Forbidden', null).message, t('error.cellLimit'));
    assertEqual('500 without a body → HTTP status', api._buildApiError(500, 'Internal Server Error', null).message, 'HTTP 500: Internal Server Error');

    suite('showViewError — the message stays in the view');
    const _savedTitle = document.title;
    const _view = document.createElement('div');
    _view.className = 'view-container';
    _view.innerHTML = '<div class="view-header"><span class="breadcrumb-current">11038 Laster...</span><h2>Laster...</h2></div>' +
      '<div id="_vc"><p class="loading-message">Laster metadata...</p></div>';
    document.body.appendChild(_view);
    AppState.selectedTable = { id: '11038', label: '11038: Laster...' };
    showViewError(_view.querySelector('#_vc'), _e404.userMessage, _e404);
    const _vp = _view.querySelector('#_vc p.error-message');
    assert('loading text replaced by the message', !!_vp && _vp.textContent.startsWith(t('error.tableNotFound')) && !_view.textContent.includes('Laster metadata'));
    assertEqual('with the link to the table-changes page', _vp?.querySelector('a')?.getAttribute('href'), AppConfig.source.tableChangesUrl.nb);
    assertEqual('link text', _vp?.querySelector('a')?.textContent, t('error.tableChangesLink'));
    assertEqual('heading says the table doesn\'t exist', _view.querySelector('h2').textContent, t('error.tableNotFoundTitle'));
    assertEqual('breadcrumb keeps only the table number', _view.querySelector('.breadcrumb-current').textContent, '11038');
    assert('the view is marked table-not-found (CSS hides its controls)', _view.classList.contains('table-not-found'));
    _view.classList.remove('table-not-found');
    _view.querySelector('#_vc').innerHTML = '<p>Laster...</p>';
    _view.querySelector('h2').textContent = 'Tittel';
    showViewError(_view.querySelector('#_vc'), 'Kunne ikke hente data', _e400);
    assert('other errors: message without a link, heading kept',
      _view.querySelector('#_vc').textContent === 'Kunne ikke hente data' && _view.querySelector('h2').textContent === 'Tittel');
    assert('other errors: the view keeps its controls', !_view.classList.contains('table-not-found'));
    const _detached = document.createElement('div');
    _detached.innerHTML = '<p>Laster...</p>';
    showViewError(_detached, 'x', _e404);
    assertEqual('a container that has left the page is left alone', _detached.textContent, 'Laster...');
    _view.remove();
    AppState.selectedTable = null;
    document.title = _savedTitle;

    suite('renderGuard — a newer render makes the older one stale');
    const _guard = renderGuard();
    assert('current right after it is taken', _guard() === true);
    renderCurrentView();   // no #content in test.html, but it still counts as a new render
    assert('stale after renderCurrentView()', _guard() === false);
    assert('a guard taken now is current', renderGuard()() === true);

    suite('renderGuard().signal — aborted when the next render starts');
    const _sigGuard = renderGuard();
    assert('not aborted while its render is current', _sigGuard.signal.aborted === false);
    renderCurrentView();
    assert('aborted after renderCurrentView()', _sigGuard.signal.aborted === true);
    assert('a guard taken now has a live signal', renderGuard().signal.aborted === false);

    suite('BrowserState.cleanTableLabel — the period goes from list titles (as in 1.4.5)');
    // Titles and periods as in SSB's /tables list, 2026-11-08
    const _clean = (label, fp, lp) => BrowserState.cleanTableLabel(label, fp, lp);
    assert('hidePeriodInTableTitles is on', AppConfig.ui.hidePeriodInTableTitles === true);
    assertEqual('year range', _clean('05327: Personer, etter arbeidsstyrkestatus, kjønn og alder 1972-2025', '1972', '2025'),
      'Personer, etter arbeidsstyrkestatus, kjønn og alder');
    assertEqual('month range after a full stop', _clean('13760: Arbeidsstyrken, etter kjønn og alder. Sesongjusterte tall 2006M01-2026M09', '2006M01', '2026M09'),
      'Arbeidsstyrken, etter kjønn og alder. Sesongjusterte tall');
    assertEqual('range of ranges in parentheses', _clean('Innovasjonsaktivitet, etter detaljert næring (SN2007) (2016-2018)-(2022-2024)', '2016-2018', '2022-2024'),
      'Innovasjonsaktivitet, etter detaljert næring (SN2007)');
    assertEqual('one period (first = last)', _clean('Valgresultat 2025', '2025', '2025'), 'Valgresultat');
    assertEqual('a period that doesn\'t match is kept', _clean('Befolkning 1986-2025', '1986', '2026'), 'Befolkning 1986-2025');
    assertEqual('a title without a period is kept', _clean('Pengemengden M1, M2 og M3', '2008M01', '2026M09'), 'Pengemengden M1, M2 og M3');
    assertEqual('no periods given → only the ID prefix goes', _clean('07459: Befolkning 1986-2026'), 'Befolkning 1986-2026');
    AppConfig.ui.hidePeriodInTableTitles = false;
    assertEqual('setting off → the period stays', _clean('05327: Personer 1972-2025', '1972', '2025'), 'Personer 1972-2025');
    AppConfig.ui.hidePeriodInTableTitles = true;

    suite('Search filters — enhanced search on by default, enh=0 turns it off (as in 1.4.5)');
    const _savedFilters = { ...BrowserState.searchFilters };
    assert('on by default', BrowserState.searchFilters.enhanced === true);
    BrowserState.searchFiltersFromParams({ q: 'bnp' });
    assert('a URL without enh → on', BrowserState.searchFilters.enhanced === true);
    assert('…and on is not written to the URL', !('enh' in BrowserState.searchFiltersToParams()));
    BrowserState.searchFiltersFromParams({ q: 'bnp', enh: '0' });
    assert('enh=0 (1.4.5 links) → off', BrowserState.searchFilters.enhanced === false);
    assertEqual('…and off is written as enh=0', BrowserState.searchFiltersToParams().enh, '0');
    BrowserState.searchFiltersFromParams({ q: 'bnp', enh: '1' });
    assert('enh=1 → on', BrowserState.searchFilters.enhanced === true);
    Object.assign(BrowserState.searchFilters, _savedFilters);

    suite('URLRouter — ssb_navRef key');
    sessionStorage.removeItem('ssb_navRef');
    assert('ssb_navRef not set initially', sessionStorage.getItem('ssb_navRef') === null);

    suite('SSBURLMapper');
    assert('SSBURLMapper exists', typeof SSBURLMapper === 'object');
    assert('fromSSB method exists',
      typeof SSBURLMapper.fromSSB === 'function' || typeof SSBURLMapper.fromSource === 'function');

    suite('detectSavedQueryId');
    assertEqual('hash #sq/30121434', detectSavedQueryId('#sq/30121434'), '30121434');
    assertEqual('query ?sq=30121434', detectSavedQueryId('https://example.com?sq=30121434'), '30121434');
    assertEqual('random text returns null', detectSavedQueryId('hello world'), null);
    assertEqual('empty returns null', detectSavedQueryId(''), null);
    // SSB-specific /statbank/sq/ path IS matched
    assertEqual('/statbank/sq/ matched',
      detectSavedQueryId('https://www.ssb.no/statbank/table/14704?sq=30121434'), '30121434');

    suite('formatNumber — Norwegian formatting');
    assertEqual('null → dash', formatNumber(null), '-');
    assertEqual('undefined → dash', formatNumber(undefined), '-');
    assertEqual('empty string → dash', formatNumber(''), '-');
    assertEqual('Infinity → dash', formatNumber(Infinity), '-');
    assertEqual('non-numeric passes through', formatNumber('i alt'), 'i alt');
    assertEqual('zero (auto-decimals)', formatNumber(0), '0');
    assertEqual('thousands separator is space', formatNumber(1000000, 0), '1 000 000');
    assertEqual('comma decimal + space thousands', formatNumber(1234.5, 1), '1 234,5');
    assertEqual('auto-detects decimal precision', formatNumber(1234.5), '1 234,5');
    assertEqual('negative number', formatNumber(-1234, 0), '-1 234');

    suite('escapeHtml — XSS-safe');
    assertEqual('escapes angle brackets', escapeHtml('<b>'), '&lt;b&gt;');
    assertEqual('ampersand escaped first (no double-escape)', escapeHtml('a & b'), 'a &amp; b');
    assertEqual('double quote', escapeHtml('"x"'), '&quot;x&quot;');
    assertEqual('single quote', escapeHtml("'x'"), '&#39;x&#39;');
    assertEqual('null → empty string', escapeHtml(null), '');
    assertEqual('undefined → empty string', escapeHtml(undefined), '');
    assertEqual('number coerced to string', escapeHtml(123), '123');

    suite('extractTableTitle');
    assertEqual('strips "id: " prefix', extractTableTitle('13760: Befolkning'), 'Befolkning');
    assertEqual('leaves unprefixed label intact', extractTableTitle('Befolkning'), 'Befolkning');
    assertEqual('empty falls back to unnamed', extractTableTitle(''), t('table.unnamed'));

    suite('URLRouter — URL-safe base64 round-trip');
    assertEqual('encode(null) → null', URLRouter.encode(null), null);
    assertEqual('encode({}) → null', URLRouter.encode({}), null);
    assertEqual('decode(null) → null', URLRouter.decode(null), null);
    assertEqual('decode("") → null', URLRouter.decode(''), null);
    const _rtObj = { Kjonn: ['1', '2'], Tid: 'top(5)' };
    const _rtEnc = URLRouter.encode(_rtObj);
    assert('encode returns a string', typeof _rtEnc === 'string');
    assert('encoded output has no +, / or = chars', !/[+/=]/.test(_rtEnc));
    assertEqual('decode(encode(obj)) round-trips',
      JSON.stringify(URLRouter.decode(_rtEnc)), JSON.stringify(_rtObj));
    const _uniObj = { region: 'Ærøskøbing Østfold æøå' };
    assertEqual('round-trips unicode (UTF-8 safe)',
      JSON.stringify(URLRouter.decode(URLRouter.encode(_uniObj))), JSON.stringify(_uniObj));
    assertEqual('decode of garbage → null', URLRouter.decode('!!!not-base64!!!'), null);

    suite('isTimeDimension — name heuristic (no metadata)');
    VarSelect.tableMetadata = null;
    assert('"Tid" is time', isTimeDimension('Tid'));
    assert('contains "tid" is time', isTimeDimension('Tidsperiode'));
    assert('"Kjonn" is not time', !isTimeDimension('Kjonn'));

    (async () => {
      suite('_throttledFetch — a call aborted while it waits is never sent');
      const _origFetch = window.fetch;
      let _fetchCalls = 0;
      window.fetch = () => { _fetchCalls++; return Promise.resolve(new Response('{}')); };
      try {
        const _ac = new AbortController();
        _ac.abort();
        const _err = await api._throttledFetch('https://example.invalid/a', { signal: _ac.signal }).catch(e => e);
        assertEqual('rejects with AbortError', _err?.name, 'AbortError');
        assertEqual('fetch() is not called', _fetchCalls, 0);
        await api._throttledFetch('https://example.invalid/b');
        assertEqual('without a signal the call goes out', _fetchCalls, 1);
      } finally {
        window.fetch = _origFetch;
      }

      suite('_throttledFetch — the rate window (2 calls per 300 ms here)');
      // The headless run's virtual clock (--virtual-time-budget) stalls Web
      // Lock requests, so these tests run without navigator.locks and check the
      // shared window logic; live-tests/sharedwindow.mjs checks the lock across
      // two tabs in real time.
      assert('navigator.locks is there, so tabs claim slots one at a time', typeof navigator.locks?.request === 'function');
      Object.defineProperty(navigator, 'locks', { value: undefined, configurable: true });
      const _limitBefore = AppConfig.limits.rateLimit;
      const _marginBefore = api._rateMarginMs;
      api._rateMarginMs = 0;   // the window alone; the margin has its own test below
      const _sent = [];
      window.fetch = () => { _sent.push(Date.now()); return Promise.resolve(new Response('{}')); };
      AppConfig.limits.rateLimit = { calls: 4, windowMs: 300 };   // × 0.5 → 2 per 300 ms
      api._writeRateWindow([]);
      api._lastRequestTime = 0;
      try {
        await Promise.all([1, 2, 3].map(n => api._throttledFetch('https://example.invalid/w' + n)));
        assertEqual('all three are sent', _sent.length, 3);
        assert('the second keeps the 100 ms gap, inside the window', _sent[1] - _sent[0] >= 95 && _sent[1] - _sent[0] < 290);
        assert('the third waits until the first has left the window', _sent[2] - _sent[0] >= 295);

        const _ac = new AbortController();
        const _t0 = Date.now();
        const _queued = api._throttledFetch('https://example.invalid/w4', { signal: _ac.signal }).catch(e => e);
        setTimeout(() => _ac.abort(), 20);
        const _err = await _queued;
        assertEqual('a call aborted while it waits rejects with AbortError', _err?.name, 'AbortError');
        assert('… at once, not when the window frees', Date.now() - _t0 < 200);
        assertEqual('… and is never sent', _sent.length, 3);
        assertEqual('… and uses no slot', api._readRateWindow().length, 2);

        // A JSON POST costs two requests (its CORS preflight counts at SSB)
        assertEqual('a GET costs 1 request', _corsRequestCount({ headers: { 'Accept': 'application/json' } }), 1);
        assertEqual('a JSON POST costs 2 (preflight + POST)',
          _corsRequestCount({ method: 'POST', headers: { 'Content-Type': 'application/json' } }), 2);
        await new Promise(r => setTimeout(r, 310));   // let the window empty
        _sent.length = 0;
        await api._throttledFetch('https://example.invalid/p', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        await api._throttledFetch('https://example.invalid/g');
        assert('after a JSON POST the window (2) is full, so the next GET waits', _sent[1] - _sent[0] >= 295);

        // Shared by all tabs: the window lives in localStorage
        assertEqual('one window per API host, not ssb_-prefixed (clearing the cache keeps it)',
          api._rateKey, 'rateWindow:data.ssb.no');
        await new Promise(r => setTimeout(r, 310));   // let the window empty
        _sent.length = 0;
        localStorage.setItem(api._rateKey, JSON.stringify([Date.now(), Date.now()]));   // another tab just sent 2
        const _tOther = Date.now();
        await api._throttledFetch('https://example.invalid/t');
        assert('calls from another tab fill the window too, so this one waits', _sent[0] - _tOther >= 290);

        // A slot is held for the window + a margin: a request reaches the source a
        // little after its slot is taken (a JSON POST only after its preflight)
        assertEqual('the margin is 1 s', _marginBefore, 1000);
        api._rateMarginMs = 100;
        api._writeRateWindow([]);
        _sent.length = 0;
        await Promise.all([1, 2, 3].map(n => api._throttledFetch('https://example.invalid/m' + n)));
        assert('with a 100 ms margin, the third waits for 300 + 100 ms', _sent[2] - _sent[0] >= 395);

        // While a call waits, the page hears of it (the 'ratewait' event; utils.js shows the notice)
        api._rateMarginMs = 0;
        api._writeRateWindow([]);
        const _waits = [];
        const _onWait = (e) => _waits.push(e.detail.until);
        window.addEventListener('ratewait', _onWait);
        try {
          await Promise.all([1, 2, 3].map(n => api._throttledFetch('https://example.invalid/e' + n)));
          assert('a call that waits announces when it should get its slot', _waits.length >= 2 && typeof _waits[0] === 'number');
          assertEqual('… and null once none waits', _waits[_waits.length - 1], null);
          _waits.length = 0;
          api._writeRateWindow([Date.now(), Date.now()]);   // full, so the next call waits
          const _ac3 = new AbortController();
          const _q3 = api._throttledFetch('https://example.invalid/e4', { signal: _ac3.signal }).catch(e => e);
          setTimeout(() => _ac3.abort(), 150);   // after the 100 ms gap, so it is waiting for a slot
          await _q3;
          assert('a call aborted while it waits announces its wait …', typeof _waits[0] === 'number');
          assertEqual('… and null when it stops', _waits[_waits.length - 1], null);
          assertEqual('… and no call is left waiting', api._rateWaiters.size, 0);
        } finally {
          window.removeEventListener('ratewait', _onWait);
        }
      } finally {
        api._rateMarginMs = _marginBefore;
        delete navigator.locks;   // back to the browser's own
        window.fetch = _origFetch;
        AppConfig.limits.rateLimit = _limitBefore;
        api._writeRateWindow([]);
        localStorage.removeItem(api._rateKey);
      }

      suite('safeApiCall — a cancelled call is silent');
      const _origShowError = showError;
      let _errorsShown = 0;
      showError = () => { _errorsShown++; };
      try {
        const _cancelled = await safeApiCall(() => Promise.reject(new DOMException('cancelled', 'AbortError')), 'x');
        assertEqual('returns null', _cancelled, null);
        assertEqual('shows no error', _errorsShown, 0);
        await safeApiCall(() => Promise.reject(new Error('boom')), 'x');
        assertEqual('another error is still shown', _errorsShown, 1);
      } finally {
        showError = _origShowError;
      }
    })().catch(e => assert('async suites ran without throwing: ' + e, false)).finally(showSummary);
  </script>
</body>
